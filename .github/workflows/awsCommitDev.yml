name: Deploy to AWS Lambda Dev

on:
  push:
    branches:
      - dev # Replace with your main branch name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Replace with your desired AWS region

      - name: Run script to update scheduler
        run: bash scripts/upload_script.sh alpaca_orders_schedule_DEV

      - name: Create Lambda deployment package
        run: |
          zip -r deployment-package.zip . -x "README.md" "workflow.jpg" "test.py" "requirements.txt" "main.py" ".gitignore" "images/*" "event.json" "main_status.py" "create_layer_aws.sh"

      - name: Deploy to AWS Lambda alpaca_orders_func_DEV
        run: |
          aws lambda update-function-code \
            --function-name alpaca_orders_func_DEV \
            --zip-file fileb://deployment-package.zip
